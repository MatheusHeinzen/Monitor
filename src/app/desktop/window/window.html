<div class="frame" [class.focused]="win().focused">
  <div class="titlebar" (pointerdown)="onTitlePointerDown($event)">
    <span class="title-icon" aria-hidden="true">
      <app-glyph [kind]="win().icon" />
    </span>
    <span class="title">{{ win().title }}</span>
    <div class="controls">
      <button type="button" class="ctrl min" (click)="minimize($event)" aria-label="Minimizar">
        _
      </button>
      <button type="button" class="ctrl close" (click)="close($event)" aria-label="Fechar">
        ×
      </button>
    </div>
  </div>
  <div class="body">
    @switch (win().appId) {
      @case ('recycle') {
        <app-recycle-bin />
      }
      @case ('outlook') {
        <app-outlook />
      }
      @case ('notepad') {
        <app-notepad [payload]="win().payload" />
      }
      @case ('word') {
        <app-word [payload]="win().payload" />
      }
      @case ('lab') {
        <app-lab-monitor />
      }
      @case ('viewer') {
        <app-picture-viewer [payload]="win().payload" />
      }
      @case ('folder') {
        <app-folder-explorer [payload]="win().payload" />
      }
      @case ('minesweeper') {
        <app-minesweeper />
      }
      @case ('ie') {
        <app-internet-explorer />
      }
    }
  </div>

  @for (edge of edges; track edge) {
    <div
      [class]="'resize edge-' + edge"
      (pointerdown)="onResizePointerDown($event, edge)"
    ></div>
  }
</div>
