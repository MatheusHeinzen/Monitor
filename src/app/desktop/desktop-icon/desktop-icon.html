<button
  type="button"
  class="icon"
  [class.selected]="selected()"
  [attr.title]="item().label"
  (click)="onClick($event)"
  (dblclick)="onDblClick($event)"
>
  <span class="glyph" aria-hidden="true">
    @switch (item().icon) {
      @case ('folder') {
        <svg viewBox="0 0 32 32">
          <path fill="#d4a017" d="M3 9h9l2 3h15v3H3z" />
          <path fill="#f2c14e" d="M3 13h26v14H3z" />
          <path fill="#ffe08a" d="M4 14h24v3H4z" />
        </svg>
      }
      @case ('document') {
        <svg viewBox="0 0 32 32">
          <path fill="#f4f4f4" d="M8 3h11l7 7v19H8z" />
          <path fill="#d9d9d9" d="M19 3v7h7" />
          <path fill="#6a9fd8" d="M11 16h12v2H11zm0 4h12v2H11zm0 4h8v2h-8z" />
        </svg>
      }
      @case ('app') {
        <svg viewBox="0 0 32 32">
          <rect x="4" y="5" width="24" height="22" rx="2" fill="#2f6fdb" />
          <rect x="4" y="5" width="24" height="6" fill="#1e4ea8" />
          <rect x="6" y="13" width="20" height="12" fill="#dce6f7" />
        </svg>
      }
      @case ('recycle') {
        <svg viewBox="0 0 32 32">
          <path fill="#8a96a3" d="M10 10h12l-1 16H11z" />
          <path fill="#b7c0c9" d="M8 8h16v3H8z" />
          <rect x="14" y="6" width="4" height="3" fill="#9aa5b0" />
        </svg>
      }
    }
  </span>
  <span class="label">{{ item().label }}</span>
</button>
