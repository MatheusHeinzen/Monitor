<button
  type="button"
  class="icon"
  [class.selected]="selected()"
  [attr.title]="item().label"
  (click)="onClick($event)"
  (dblclick)="onDblClick($event)"
>
  <span class="glyph" aria-hidden="true">
    <app-glyph [kind]="item().icon" />
  </span>
  <span class="label">{{ item().label }}</span>
</button>
