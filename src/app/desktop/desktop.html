<div class="desktop" (click)="clearSelection()">
  <div class="icons">
    @for (item of items(); track item.id) {
      <app-desktop-icon
        [item]="item"
        [selected]="selectedId() === item.id"
        (select)="select($event)"
        (open)="open($event)"
      />
    }
  </div>

  @for (win of windows(); track win.id) {
    @if (!win.minimized) {
      <app-window [win]="win" />
    }
  }

  @if (investigation.alarmVisible()) {
    <div class="alarm" role="alertdialog" aria-labelledby="alarm-title" (click)="$event.stopPropagation()">
      <div class="alarm-card">
        <p id="alarm-title">ALERTA: ALIMENTAÇÃO DO DUTO CENTRAL CORTADA</p>
        <button type="button" (click)="investigation.dismissAlarm()">Dispensar</button>
      </div>
    </div>
  }

  <app-taskbar />
</div>
