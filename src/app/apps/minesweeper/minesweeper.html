<div class="mine">
  <div class="hud">
    <div class="counter">{{ minesLeft() | number: '3.0-0' }}</div>
    <button type="button" class="face" (click)="reset()" [attr.aria-label]="'Novo jogo'">
      {{ face() }}
    </button>
    <div class="counter">{{ elapsed() | number: '3.0-0' }}</div>
  </div>

  <div class="board" [style.grid-template-columns]="'repeat(' + cols + ', 20px)'">
    @for (row of board(); track $index) {
      @for (cell of row; track cell.col) {
        <button
          type="button"
          class="cell"
          [class.revealed]="cell.revealed"
          [class.mine]="cell.revealed && cell.mine"
          [class.flag]="!cell.revealed && cell.flagged"
          [attr.data-n]="cell.revealed && !cell.mine && cell.adjacent > 0 ? cell.adjacent : null"
          (click)="onLeftClick(cell)"
          (contextmenu)="onRightClick($event, cell)"
        >
          @if (!cell.revealed && cell.flagged) {
            🚩
          } @else if (cell.revealed && cell.mine) {
            💣
          } @else if (cell.revealed && cell.adjacent > 0) {
            {{ cell.adjacent }}
          }
        </button>
      }
    }
  </div>
</div>
