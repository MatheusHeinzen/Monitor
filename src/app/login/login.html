<div class="screen">
  <header class="chrome top"></header>

  <main class="welcome">
    <section class="brand">
      <div class="logo">
        <svg class="flag" viewBox="0 0 88 88" aria-hidden="true">
          <path fill="#f25022" d="M4 16 41 10v32H4z" />
          <path fill="#7fba00" d="M47 9 84 2v40H47z" />
          <path fill="#00a4ef" d="M4 46h37v32L4 72z" />
          <path fill="#ffb900" d="M47 46h37v40l-37-8z" />
        </svg>
        <div class="wordmark">
          <span class="ms">Microsoft</span>
          <span class="win">Windows <em>xp</em></span>
        </div>
      </div>
      <p class="prompt">Para começar, clique no seu nome de usuário</p>
    </section>

    <div class="split" aria-hidden="true"></div>

    <section class="users">
      @if (selected(); as account) {
        <form class="account" (ngSubmit)="submit()">
          <div class="picture helio" aria-hidden="true">
            <svg viewBox="0 0 48 48">
              <rect width="48" height="48" fill="#2c5aa0" />
              <circle cx="24" cy="18" r="8" fill="#ead2a8" />
              <path d="M10 42c2-10 8-14 14-14s12 4 14 14" fill="#1a3a6e" />
            </svg>
          </div>

          <div class="fields">
            <p class="name">{{ account.displayName }}</p>
            <p class="sub">{{ account.username }}</p>
            <label for="login-pass">Digite sua senha</label>
            <div class="row">
              <input
                id="login-pass"
                name="password"
                type="password"
                autocomplete="current-password"
                autofocus
                [(ngModel)]="password"
              />
              <button type="submit" class="icon-btn go" aria-label="Entrar">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                  <path fill="#fff" d="M1 7h8L6.2 4.2 7.6 2.8 13 8l-5.4 5.2-1.4-1.4L9 9H1z" />
                </svg>
              </button>
              <button
                type="button"
                class="icon-btn help"
                aria-label="Voltar"
                (click)="clearSelection()"
              >
                ←
              </button>
            </div>

            @if (showError()) {
              <p class="error">Senha inválida.</p>
            }
          </div>
        </form>
      } @else {
        <ul class="account-list">
          @for (account of accounts; track account.id) {
            <li>
              <button type="button" class="account pick" (click)="selectAccount(account)">
                <div class="picture" [class.helio]="account.role === 'helio'" [class.guest]="account.role === 'guest'" aria-hidden="true">
                  @if (account.role === 'helio') {
                    <svg viewBox="0 0 48 48">
                      <rect width="48" height="48" fill="#2c5aa0" />
                      <circle cx="24" cy="18" r="8" fill="#ead2a8" />
                      <path d="M10 42c2-10 8-14 14-14s12 4 14 14" fill="#1a3a6e" />
                    </svg>
                  } @else {
                    <svg viewBox="0 0 48 48">
                      <rect width="48" height="48" fill="#5a7a3a" />
                      <circle cx="24" cy="18" r="8" fill="#d8c4a0" />
                      <path d="M10 42c2-10 8-14 14-14s12 4 14 14" fill="#3a5228" />
                    </svg>
                  }
                </div>
                <div class="fields">
                  <p class="name">{{ account.displayName }}</p>
                  <p class="sub">{{ account.subtitle }}</p>
                </div>
              </button>
            </li>
          }
        </ul>
      }
    </section>

    <aside class="postit" aria-label="Nota adesiva">
      <p class="postit-title">lembrete</p>
      <p>{{ postit }}</p>
    </aside>
  </main>

  <footer class="chrome bottom">
    <button type="button" class="power">
      <span class="power-glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" fill="#e74c3c" />
          <path
            fill="none"
            stroke="#fff"
            stroke-width="2.2"
            d="M12 7v6M8.2 9.2a5.2 5.2 0 1 0 7.6 0"
          />
        </svg>
      </span>
      Desligar o computador
    </button>
    <p class="footer-hint">{{ footer }}</p>
  </footer>
</div>
